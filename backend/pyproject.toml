[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
  venv
  | __pycache__
  | \.git
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_third_party = ["fastapi", "sqlalchemy", "pydantic", "uvicorn"]
skip = ["venv", "__pycache__", ".git"]
